name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Allow the workflow to publish to Pages; no other write access is granted.
permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deployments at once; let a newer push finish rather than cancel it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify the numerical core
        run: npm test
      - name: Build
        # Served from https://<owner>.github.io/<repo>/, so assets need that prefix.
        # GITHUB_REPOSITORY is "owner/repo"; strip the owner. The trailing slash matters.
        # If you later attach a custom domain, change this to BASE_PATH=/ instead.
        run: |
          export BASE_PATH="/${GITHUB_REPOSITORY#*/}/"
          echo "Building with base path: $BASE_PATH"
          npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
