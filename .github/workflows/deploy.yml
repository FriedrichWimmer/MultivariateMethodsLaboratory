name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Allow the workflow to publish to Pages; no write access to the code itself.
permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deployments at once; let a newer push finish rather than cancel it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Verify the numerical core
        run: npm test

      # Must run before the build: it reports the sub-path the site is served from.
      # Requires Pages to be enabled with Source = "GitHub Actions" in the repository
      # settings. (The `enablement` input can create it automatically, but it needs a
      # personal access token rather than the built-in GITHUB_TOKEN, so the one-time
      # settings toggle is simpler.)
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v6

      # base_path is "/<repo>" for a project site and "" for a user site or custom
      # domain; appending "/" yields the correct Vite base in both cases.
      - name: Build
        run: npm run build
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}/

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
